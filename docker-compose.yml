services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fungames
      POSTGRES_PASSWORD: fungames
      POSTGRES_DB: fungames
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fungames -d fungames"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
